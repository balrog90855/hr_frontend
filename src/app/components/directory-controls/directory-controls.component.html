<div class="flex flex-col gap-8 mb-10">
  <div class="flex items-center justify-between">
    <div class="relative flex items-center gap-3">
      <label class="text-sm font-semibold text-slate-400" for="team-filter-main">Filter by Team:</label>
      <select (change)="onTeamFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[180px]" id="team-filter-main">
        <option *ngFor="let option of teamOptions()" [value]="option.value" [selected]="option.value === teamFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="location-filter-main">Location:</label>
      <select (change)="onLocationFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[150px]" id="location-filter-main">
        <option *ngFor="let option of locationOptions()" [value]="option.value" [selected]="option.value === locationFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="status-filter-main">Status:</label>
      <select (change)="onStatusFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[160px]" id="status-filter-main">
        <option *ngFor="let option of statusOptions()" [value]="option.value" [selected]="option.value === statusFilter()">{{ option.label }}</option>
      </select>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold text-slate-400">Show:</span>
      <select (change)="onPageSizeChange($any($event.target).value)" class="bg-transparent border-none text-sm font-bold text-blue-900 focus:ring-0 cursor-pointer">
        <option *ngFor="let option of pageSizeOptions" [value]="option.value" [selected]="option.value === pageSize().toString()">{{ option.label }}</option>
      </select>

      <span class="text-sm font-semibold text-slate-400">Sort by:</span>
      <select (change)="onSortByChange($any($event.target).value)" class="bg-transparent border-none text-sm font-bold text-blue-900 focus:ring-0 cursor-pointer">
        <option *ngFor="let option of sortOptions" [value]="option.value" [selected]="option.value === sortBy()">{{ option.label }}</option>
      </select>
    </div>
  </div>
</div>
