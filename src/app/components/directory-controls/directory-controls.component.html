<div class="flex flex-col gap-4 mb-10">

  <!-- View mode toggle -->
  <div class="flex items-center gap-1 self-start bg-white rounded-full shadow-sm p-1 border border-slate-100">
    <button
      type="button"
      (click)="setViewMode('directory')"
      [class]="viewMode() === 'directory'
        ? 'px-5 py-2 rounded-full text-sm font-bold bg-blue-900 text-white shadow-sm transition-all'
        : 'px-5 py-2 rounded-full text-sm font-bold text-slate-500 hover:text-blue-900 transition-all'">
      <span class="material-symbols-outlined text-[16px] align-middle mr-1">group</span>Directory
    </button>
    <button
      type="button"
      (click)="setViewMode('appraisals')"
      [class]="viewMode() === 'appraisals'
        ? 'px-5 py-2 rounded-full text-sm font-bold bg-blue-900 text-white shadow-sm transition-all'
        : 'px-5 py-2 rounded-full text-sm font-bold text-slate-500 hover:text-blue-900 transition-all'">
      <span class="material-symbols-outlined text-[16px] align-middle mr-1">event_available</span>Appraisals
    </button>
  </div>

  <!-- Filters + sort row -->
  <div class="flex items-center justify-between">

    <!-- Directory filters -->
    <div *ngIf="viewMode() === 'directory'" class="relative flex items-center gap-3">
      <label class="text-sm font-semibold text-slate-400" for="team-filter-main">Filter by Team:</label>
      <select (change)="onTeamFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[180px]" id="team-filter-main">
        <option *ngFor="let option of teamOptions()" [value]="option.value" [selected]="option.value === teamFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="location-filter-main">Location:</label>
      <select (change)="onLocationFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[150px]" id="location-filter-main">
        <option *ngFor="let option of locationOptions()" [value]="option.value" [selected]="option.value === locationFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="status-filter-main">Status:</label>
      <select (change)="onStatusFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[160px]" id="status-filter-main">
        <option *ngFor="let option of statusOptions()" [value]="option.value" [selected]="option.value === statusFilter()">{{ option.label }}</option>
      </select>
    </div>

    <!-- Appraisals filters -->
    <div *ngIf="viewMode() === 'appraisals'" class="relative flex items-center gap-3">
      <label class="text-sm font-semibold text-slate-400" for="service-filter-main">Service:</label>
      <select (change)="onServiceFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[180px]" id="service-filter-main">
        <option *ngFor="let option of serviceOptions()" [value]="option.value" [selected]="option.value === serviceFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="grade-filter-main">Grade:</label>
      <select (change)="onGradeFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[150px]" id="grade-filter-main">
        <option *ngFor="let option of gradeOptions()" [value]="option.value" [selected]="option.value === gradeFilter()">{{ option.label }}</option>
      </select>

      <label class="text-sm font-semibold text-slate-400" for="duedate-filter-main">Due within:</label>
      <select (change)="onDueDateFilterChange($any($event.target).value)" class="h-11 px-6 bg-white border-none rounded-full text-sm font-bold text-blue-900 focus:ring-2 focus:ring-primary/20 cursor-pointer shadow-sm min-w-[160px]" id="duedate-filter-main">
        <option *ngFor="let option of dueDateOptions" [value]="option.value" [selected]="option.value === appraisalDueDateFilter()">{{ option.label }}</option>
      </select>
    </div>

    <!-- Sort + page size (always visible) -->
    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold text-slate-400">Show:</span>
      <select (change)="onPageSizeChange($any($event.target).value)" class="bg-transparent border-none text-sm font-bold text-blue-900 focus:ring-0 cursor-pointer">
        <option *ngFor="let option of pageSizeOptions" [value]="option.value" [selected]="option.value === pageSize().toString()">{{ option.label }}</option>
      </select>

      <span class="text-sm font-semibold text-slate-400">Sort by:</span>
      <select (change)="onSortByChange($any($event.target).value)" class="bg-transparent border-none text-sm font-bold text-blue-900 focus:ring-0 cursor-pointer">
        <option *ngFor="let option of sortOptions()" [value]="option.value" [selected]="option.value === sortBy()">{{ option.label }}</option>
      </select>
    </div>

  </div>
</div>
